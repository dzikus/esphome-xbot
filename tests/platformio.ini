; Unit tests for components/xbot - run from the tests/ directory:
;   pio test -e native
;
; Tests are pure C++ (no esphome dependencies) and run on the host, not the
; ESP32. The pure functions in xbot_protocol.cpp are pulled in directly.

[platformio]
test_dir = .

[env:native]
platform = native
test_framework = unity
test_filter = test_*
; Same standard esphome sets for every platform it targets, so what compiles
; here is what compiles on the node.
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
    -Werror
    -I ../components/xbot
