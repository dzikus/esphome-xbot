name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: test gate and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # persist-credentials: false keeps the write-scoped token out of .git so the
      # third-party toolchains below (esphome/pio deps) cannot reach it. gh below
      # authenticates via the GH_TOKEN env instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ESPHome and PlatformIO
        run: pip install esphome platformio
      - name: Run protocol unit tests (release gate)
        run: |
          set -euo pipefail
          # The wrapper exits on SIGHUP and reports ERRORED on a green run, so
          # its status is not the answer. The binary it built is.
          pio test -d tests -e native < /dev/null || echo "pio wrapper rc=$?, binary decides"
          tests/.pio/build/native/program
      - name: Compile full component (release gate)
        run: |
          set -euo pipefail
          esphome compile .github/ci-build.yaml
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
